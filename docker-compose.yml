services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10
    container_name: homeassistant
    volumes:
      - ./homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Madrid
    depends_on:
      - mosquitto
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - homeassistant
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      - TZ=Europe/Madrid
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt
    restart: unless-stopped
    networks:
      - homeassistant
    ports:
      - "8080:8080"
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    environment:
      - TZ=Europe/Madrid
    depends_on:
      - mosquitto
  duckdns:
    image: linuxserver/duckdns
    container_name: duckdns
    restart: unless-stopped
    networks:
      - homeassistant
    volumes:
      - ./duckdns/config:/config
    environment:
      - TZ=Europe/Madrid
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}
      - TOKEN=${DUCKDNS_TOKEN}
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    networks:
      - homeassistant
    depends_on:
      - homeassistant
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./caddy/conf:/etc/caddy

networks:
  homeassistant:
    name: homeassistant
    driver: bridge
